<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It Should Work — Archive</title>
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">

  <meta name="description" content="Every past photo of the day from It Should Work — a growing archive of things that were designed to work, and don't.">
  <link rel="canonical" href="https://itshouldwork.org/archive.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="It Should Work">
  <meta property="og:url" content="https://itshouldwork.org/archive.html">
  <meta property="og:title" content="It Should Work — Archive">
  <meta property="og:description" content="Every past photo of the day from It Should Work.">
  <meta property="og:image" content="https://itshouldwork.org/photo.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JNZSFS7J4K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JNZSFS7J4K');
  </script>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #111; }
    body {
      font: 15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
      color: #eee;
      padding: 40px 20px 80px;
    }
    header { max-width: 1100px; margin: 0 auto 32px; }
    header h1 { font-size: 24px; margin: 0 0 4px; font-weight: 600; }
    header p { margin: 0; color: rgba(255,255,255,0.5); }
    header a { color: rgba(255,255,255,0.6); }
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card .thumb {
      aspect-ratio: 4 / 3;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .body { padding: 14px 16px 16px; }
    .card .date { font-size: 12px; color: rgba(255,255,255,0.45); margin-bottom: 6px; }
    .card .story { margin: 0 0 8px; }
    .card .meta { font-size: 12px; color: rgba(255,255,255,0.4); }
    .card .meta a { color: rgba(255,255,255,0.55); }
    #empty { max-width: 1100px; margin: 0 auto; color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <header>
    <h1>It Should Work — Archive</h1>
    <p>Every photo of the day so far. <a href="/">← back to today</a></p>
  </header>
  <div class="grid" id="grid"></div>
  <p id="empty" hidden>No photos yet.</p>

  <script>
    function fmtDate(s) {
      if (!s) return '';
      var d = new Date(s + 'T00:00:00Z');
      return isNaN(d) ? s : d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
    }
    function el(tag, attrs, text) {
      var n = document.createElement(tag);
      if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
      if (text != null) n.textContent = text;
      return n;
    }

    fetch('history.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var photos = (data && data.photos) || [];
        var grid = document.getElementById('grid');
        if (!photos.length) { document.getElementById('empty').hidden = false; return; }
        photos.forEach(function (p) {
          var card = el('div', { class: 'card' });

          var thumb = el('div', { class: 'thumb' });
          var img = el('img', { loading: 'lazy', alt: p.alt || '', src: p.file });
          thumb.appendChild(img);

          var body = el('div', { class: 'body' });
          body.appendChild(el('div', { class: 'date' }, fmtDate(p.date)));
          body.appendChild(el('p', { class: 'story' }, p.story || p.alt || ''));

          var meta = el('div', { class: 'meta' });
          var label = (p.credit || '');
          if (p.license) label += (label ? ' · ' : '') + p.license;
          if (p.source) {
            var a = el('a', { href: p.source, target: '_blank', rel: 'noopener noreferrer' }, label || 'source');
            meta.appendChild(a);
          } else if (label) {
            meta.appendChild(document.createTextNode(label));
          }
          body.appendChild(meta);

          card.appendChild(thumb);
          card.appendChild(body);
          grid.appendChild(card);
        });
      })
      .catch(function () { document.getElementById('empty').hidden = false; });
  </script>
</body>
</html>
