<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It Should Work</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <!-- The daily scout agent updates photo.json + the image file. This page just renders it. -->
  <img id="photo" alt="">
  <script>
    // Cache-bust photo.json so the latest pick shows up without a hard refresh.
    fetch('photo.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var img = document.getElementById('photo');
        img.src = data.file + '?v=' + encodeURIComponent(data.date || '');
        img.alt = data.alt || 'Photo of the day';
      })
      .catch(function () {
        document.getElementById('photo').src = 'https://picsum.photos/1200/800';
      });
  </script>
</body>
</html>
