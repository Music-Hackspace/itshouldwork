<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It Should Work</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    /* Small, unobtrusive source credit in the corner. */
    #credit {
      position: fixed;
      right: 10px;
      bottom: 8px;
      font: 11px/1.4 -apple-system, system-ui, sans-serif;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      max-width: 60vw;
      text-align: right;
    }
    #credit:hover { color: rgba(255, 255, 255, 0.75); }
  </style>
</head>
<body>
  <!-- The daily scout agent updates photo.json + the image file. This page just renders it. -->
  <img id="photo" alt="">
  <a id="credit" href="#" target="_blank" rel="noopener noreferrer" hidden></a>
  <script>
    // Cache-bust photo.json so the latest pick shows up without a hard refresh.
    fetch('photo.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var img = document.getElementById('photo');
        img.src = data.file + '?v=' + encodeURIComponent(data.date || '');
        img.alt = data.alt || 'Photo of the day';

        // Tiny corner credit, linked to the source when available.
        var credit = document.getElementById('credit');
        var label = data.credit || '';
        if (data.license) label += (label ? ' · ' : '') + data.license;
        if (label) {
          credit.textContent = label;
          if (data.source) credit.href = data.source; else credit.removeAttribute('href');
          credit.hidden = false;
        }
      })
      .catch(function () {
        document.getElementById('photo').src = 'https://picsum.photos/1200/800';
      });
  </script>
</body>
</html>
