name: Test Bluesky post

# Manual-only: posts the CURRENT photo.json pick to Bluesky without running the
# scout. Use to verify Bluesky credentials/wiring. Safe to run anytime; it does
# not create a new daily pick. (The real daily post happens in daily-scout.yml.)

on:
  workflow_dispatch:
    inputs:
      delete_all:
        description: "Delete ALL Bluesky posts (test cleanup) instead of posting"
        type: boolean
        default: false

jobs:
  test-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post or clean up Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          pip install --quiet Pillow
          if [ "${{ github.event.inputs.delete_all }}" = "true" ]; then
            python3 agent/cleanup-bluesky.py
          else
            python3 agent/post-bluesky.py
          fi
