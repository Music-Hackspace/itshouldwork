name: Daily photo scout

# Publishes itshouldwork.org's photo of the day. Runs in GitHub's cloud, so it
# works regardless of whether any local machine is on.
#
# One-time setup: add a repo secret named CLAUDE_CODE_OAUTH_TOKEN
#   1. On your machine: run  claude setup-token   and copy the token it prints.
#   2. gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo Music-Hackspace/itshouldwork
#      (or GitHub UI: Settings -> Secrets and variables -> Actions -> New secret)

on:
  schedule:
    # Two firings so the pick changes over at 08:00 UK time year-round (GitHub
    # cron is UTC-only and does not follow DST). The gate job below lets exactly
    # one of these proceed depending on whether the UK is on BST or GMT.
    - cron: '0 7 * * *'   # 08:00 UK while on BST (summer)
    - cron: '0 8 * * *'   # 08:00 UK while on GMT (winter)
  workflow_dispatch: {}    # lets you trigger a test run from the Actions tab

permissions:
  contents: write          # so the built-in token can push the daily update
  id-token: write          # required by claude-code-action for OIDC auth

concurrency:
  group: daily-scout
  cancel-in-progress: false

jobs:
  # Proceed only on the cron firing that corresponds to 08:00 UK *today*. Keys
  # off the UK timezone abbreviation (BST/GMT), which is stable for months, so a
  # delayed GitHub run still evaluates correctly. Manual runs always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ZONE=$(TZ=Europe/London date +%Z)
          SCHED='${{ github.event.schedule }}'
          if { [ "$ZONE" = "BST" ] && [ "$SCHED" = "0 7 * * *" ]; } || \
             { [ "$ZONE" = "GMT" ] && [ "$SCHED" = "0 8 * * *" ]; }; then
            echo "8am UK ($ZONE) — proceeding."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the 8am-UK firing (zone=$ZONE sched=$SCHED) — skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  scout:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the agent can de-dupe recent picks

      # Decide the previous day's vote BEFORE the scout overwrites candidates.json.
      # Reads vote tallies, promotes the winner to photo.json (+ photo.<ext>), and
      # announces it on Bluesky. No-op on the very first run (no candidates.json).
      - name: Decide yesterday's winner
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          pip install --quiet Pillow
          python3 agent/decide-winner.py

      - name: Commit winner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -n "$(git status --porcelain photo.json)" ]; then
            DATE=$(python3 -c "import json;print(json.load(open('photo.json')).get('date',''))")
            git config user.name "itshouldwork-scout"
            git config user.email "actions@users.noreply.github.com"
            git add photo.json photo.* 2>/dev/null || git add photo.json
            git commit -m "Daily winner: vote result for ${DATE}"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No winner to commit (first run or no pending vote)."
          fi

      - name: Run daily photo scout
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the file agent/scout-prompt.md in this repository and follow its
            instructions EXACTLY to publish TODAY'S TWO CANDIDATES for itshouldwork.org.

            You are running unattended in GitHub Actions: do NOT ask questions, make the
            best judgment call yourself, and complete every step end to end.

            First set the git identity:
              git config user.name "itshouldwork-scout"
              git config user.email "actions@users.noreply.github.com"

            You MUST complete all of: discover fresh, safe, funny design-flaw / unrealistic-
            expectations news stories (last 1-7 days); apply the safety filter (no injury, death,
            illness, disaster, or human suffering); pick the TWO best, each with a genuinely funny
            image; obtain a usable image for each (prefer a CC/Wikimedia photo of the subject, else
            the article's og:image, crediting the publisher); download them to the repo root as
            candidate-a.<ext> and candidate-b.<ext>; verify each is a valid image > 30KB; write
            candidates.json with both candidates' metadata (including a short `tagline` and the
            vote `key` per the spec); do NOT reuse a photo/subject/story from the last ~30 days
            (check git log, history.json, and photo.json); then:
              git add -A && git commit -m "Daily candidates: <slug A> vs <slug B> (<today UTC date>)" && git push origin HEAD:main

            Do NOT edit index.html, archive.html, history.json, sitemap.xml, the archive/ folder,
            or photo.json / photo.* — those are managed automatically (photo.json holds the decided
            winner). Never publish anything depicting harm to people.
          claude_args: '--model claude-sonnet-4-6 --allowedTools "Bash Read Write Edit Glob Grep WebSearch WebFetch"'

      - name: Rebuild archive + SEO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # The claude-code-action step above leaves origin's credentials unusable
          # for a plain git push, so re-point origin at a token-authenticated URL.
          # (Pushes via the built-in GITHUB_TOKEN don't re-trigger workflows, so no loop.)
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase origin main
          python3 agent/build-site.py
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "itshouldwork-scout"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Update archive + SEO for latest photo"
            git push origin HEAD:main
          fi

      - name: Post candidates to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          pip install --quiet Pillow
          python3 agent/post-candidates.py
